  <title>May 2026 Kharg oil slick</title>

  <script id="header" type="text/markdown">
    # May 2026 Kharg oil slick
    *11 May 2026*
  </script>

  <script id="intro" type="text/markdown">
    On 8 May 2026, [Reuters reported](https://www.reuters.com/world/middle-east/suspected-oil-spill-seen-satellite-images-near-irans-kharg-island-export-hub-2026-05-08/) on a suspected oil spill at Iran's main crude export terminal at Kharg Island, based on initial analysis by Data Desk and the [Conflict and Environment Observatory (CEOBS)](https://ceobs.org/). This briefing reviews the full Copernicus Sentinel-2 (optical) and Sentinel-1 (radar) record between 6 and 11 May 2026 to track the spill's progression.

    In summary: a coherent oil slick is first visible on 6 May, by which point the spill is already several hours old. It expands to roughly 25 km of dark, oil-dampened water south of the island by 8 May, breaks up and drifts a further 30–50 km south through 9 May, and is no longer fully visible after that point due to heavy cloud cover, although residual oil sheen remains clearly identifiable in the waters immediately around Kharg as of this morning. For automated, continuous tracking of slicks of this kind, SkyTruth's [Cerulean](https://cerulean.skytruth.org/) platform is a useful complementary resource.

    ### Satellite passes

    - **[6 May, 07:16 UTC](#6-may-07-16-utc-first-sighting)** — Sentinel-2C (optical)
    - **[6 May, 14:42 UTC](#6-may-14-42-utc-radar-confirmation)** — Sentinel-1A (radar)
    - **[8 May, 02:38 UTC](#8-may-02-38-utc-peak-extent)** — Sentinel-1C (radar)
    - **[8 May, 07:23 UTC](#8-may-07-23-utc-clouded-optical-pass)** — Sentinel-2A (optical)
    - **[9 May, 02:38 UTC](#9-may-02-38-utc-drift-south)** — Sentinel-1D (radar)
    - **[11 May, 07:16 UTC](#11-may-07-16-utc-residual-sheen)** — Sentinel-2B (optical)

    ---
  </script>

  <script id="impact-map-h" type="text/markdown">
    ## Impact map

    Spill extent across the Sentinel-1 radar passes and the 11 May Sentinel-2 sheen trace (dashed where SAR was unavailable), set against the wider Persian Gulf and its oil and gas infrastructure. Polygons are coloured by pass in chronological order. The 9 May fragments sit ~40 km south of Kharg, in shipping lanes used by tankers entering and leaving the terminal; by 11 May, a bright sheen band has tracked ~55 km south.
  </script>

  <script id="overview-map-html" type="text/html">
    <figure style="max-width:100%;">
      <div id="overview-map-container" style="width:100%; height:560px; border-radius:4px; background:#0a0a0a;"></div>
      <figcaption style="margin-top:8px;">
        <div id="overview-map-legend" style="display:flex; gap:1.4em; flex-wrap:wrap; align-items:center; margin-bottom:6px;"></div>
        Slick polygons: Data Desk / Copernicus Sentinel-1 + Sentinel-2. Infrastructure: © Mapstand. Basemap © OpenStreetMap contributors, © CARTO.
      </figcaption>
    </figure>
  </script>

  <script id="overview-map-js" type="module">
    const cssId = "maplibre-css";
    if (!document.getElementById(cssId)) {
      const link = document.createElement("link");
      link.id = cssId;
      link.rel = "stylesheet";
      link.href = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css";
      document.head.appendChild(link);
    }
    const maplibre = (await import("https://esm.sh/maplibre-gl@4.7.1")).default;
    const Plot = await import("https://esm.sh/@observablehq/plot");
    const d3sc = await import("https://esm.sh/d3-scale-chromatic@3");
    const fc = await FileAttachment("../data/slicks.geojson").json();
    const infra = await FileAttachment("../data/infrastructure.geojson").json();

    // One colour per pass (date + sensor), sampled from the turbo spectrum so
    // the palette extends gracefully as more passes are added. The sampled
    // range is clipped to [0.15, 0.85] to avoid turbo's very dark blue start
    // and very dark red end, which both vanish against a dark basemap.
    const passKey = f => `${f.properties.date}|${f.properties.sensor}`;
    const passes = [...new Map(
      [...fc.features]
        .sort((a, b) => a.properties.sensing_time.localeCompare(b.properties.sensing_time))
        .map(f => [passKey(f), {
          key: passKey(f),
          date: f.properties.date,
          sensor: f.properties.sensor,
          sensing_time: f.properties.sensing_time,
          kind: f.properties.kind,
        }])
    ).values()];
    const colourRange = passes.map((_, i) =>
      d3sc.interpolateTurbo(passes.length === 1 ? 0.5 : 0.15 + 0.7 * (i / (passes.length - 1)))
    );
    const colourScale = Plot.scale({color: {
      type: "ordinal",
      domain: passes.map(p => p.key),
      range: colourRange,
    }});
    const colourFor = key => colourScale.apply(key);

    const map = new maplibre.Map({
      container: "overview-map-container",
      style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
      bounds: [[49.081421, 28.488005], [51.317139, 29.645095]],
      fitBoundsOptions: { padding: 24, animate: false },
      attributionControl: false,
    });

    map.on("load", () => {
      map.addSource("infra", { type: "geojson", data: infra });
      map.addLayer({
        id: "infra-pipeline",
        type: "line",
        source: "infra",
        filter: ["==", ["get", "kind"], "pipeline"],
        paint: { "line-color": "#00ff66", "line-width": 0.8, "line-opacity": 0.7 },
      });
      map.addLayer({
        id: "infra-platform",
        type: "circle",
        source: "infra",
        filter: ["==", ["get", "kind"], "platform"],
        paint: {
          "circle-radius": 2.2,
          "circle-color": "rgba(0,0,0,0)",
          "circle-stroke-color": "#00ff66",
          "circle-stroke-width": 0.8,
          "circle-stroke-opacity": 0.85,
        },
      });
      map.addLayer({
        id: "infra-terminal",
        type: "circle",
        source: "infra",
        filter: ["==", ["get", "kind"], "terminal"],
        paint: {
          "circle-radius": 4.5,
          "circle-color": "rgba(0,0,0,0)",
          "circle-stroke-color": "#00ff66",
          "circle-stroke-width": 1.2,
          "circle-stroke-opacity": 0.95,
        },
      });

      map.addSource("slicks", { type: "geojson", data: fc });
      for (const p of passes) {
        const colour = colourFor(p.key);
        const filt = ["all",
          ["==", ["get", "date"], p.date],
          ["==", ["get", "sensor"], p.sensor],
        ];
        const coreFilter = ["all", filt, ["==", ["get", "kind"], "core"]];
        const sheenFilter = ["all", filt, ["==", ["get", "kind"], "sheen"]];
        const safe = p.key.replace(/[^a-z0-9]/gi, "_");
        map.addLayer({
          id: `core-fill-${safe}`, type: "fill", source: "slicks", filter: coreFilter,
          paint: { "fill-color": colour, "fill-opacity": 0.55 },
        });
        map.addLayer({
          id: `core-line-${safe}`, type: "line", source: "slicks", filter: coreFilter,
          paint: { "line-color": colour, "line-width": 1.0, "line-opacity": 0.95 },
        });
        map.addLayer({
          id: `sheen-fill-${safe}`, type: "fill", source: "slicks", filter: sheenFilter,
          paint: { "fill-color": colour, "fill-opacity": 0.15 },
        });
        map.addLayer({
          id: `sheen-line-${safe}`, type: "line", source: "slicks", filter: sheenFilter,
          paint: {
            "line-color": colour, "line-width": 1.4, "line-opacity": 0.95,
            "line-dasharray": [2, 2],
          },
        });
      }
    });

    // Build the legend from the same passes + colour scale that paint the map.
    const legendEl = document.getElementById("overview-map-legend");
    const fmt = new Intl.DateTimeFormat("en-GB", {day: "numeric", month: "short", timeZone: "UTC"});
    const passKinds = new Map();
    for (const f of fc.features) {
      const k = passKey(f);
      if (!passKinds.has(k)) passKinds.set(k, new Set());
      passKinds.get(k).add(f.properties.kind);
    }
    const items = passes.map(p => {
      const t = new Date(Math.round(new Date(p.sensing_time).getTime() / 60000) * 60000);
      const hh = String(t.getUTCHours()).padStart(2, "0");
      const mm = String(t.getUTCMinutes()).padStart(2, "0");
      const date = fmt.format(t);
      const isSheen = passKinds.get(p.key)?.has("sheen") && !passKinds.get(p.key)?.has("core");
      const label = `${date}, ${hh}:${mm} UTC (${isSheen ? "S2 sheen" : "SAR"})`;
      const colour = colourFor(p.key);
      const swatch = isSheen
        ? `border:1.5px dashed ${colour};`
        : `background:${colour};`;
      return `<span style="display:inline-flex;align-items:center;gap:6px;">
        <span style="width:14px;height:14px;${swatch};border-radius:2px;display:inline-block;"></span>
        ${label}
      </span>`;
    });
    items.push(
      `<span style="opacity:0.6;">·</span>`,
      `<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:2px;background:#00ff66;display:inline-block;"></span>pipelines, platforms &amp; terminals</span>`,
    );
    legendEl.innerHTML = items.join("");
  </script>

  <script id="6may-s2-h" type="text/markdown">
    ## 6 May, 07:16 UTC — first sighting

    Bright white streaks extend west and southwest of Kharg in the morning Sentinel-2 image, where surface oil, organised into wind-driven convergence lines, brightens against the surrounding sea in this sun-glint–favourable geometry. The brightest cores may include thicker emulsified material.
  </script>

  <script id="6may-s1-h" type="text/markdown">
    ## 6 May, 14:42 UTC — radar confirmation

    Seven and a half hours later, the Sentinel-1 radar pass confirms an oil slick: a coherent dark patch extending about 15 km south of Kharg, with a tail curving further south. The dark area sits directly over the dense cluster of offshore platforms immediately west and southwest of the island. The bright dots scattered around are tankers and other vessels at anchor.
  </script>

    <figure style="max-width:100%">

    </figure>
  </script>

  <script id="8may-s1-h" type="text/markdown">
    ## 8 May, 02:38 UTC — peak extent

    Thirty-six hours later, the slick has grown markedly. The main dark area now extends about 25 km in length, with its southernmost edge roughly 30 km south of Kharg. A separate, smaller plume east of the island appears to trail behind a vessel and may indicate a second, independent source.
  </script>

    </figure>
  </script>

  <script id="8may-s2-h" type="text/markdown">
    ## 8 May, 07:23 UTC — clouded optical pass

    Five hours after the radar image, the Sentinel-2 capture of the same area is largely obscured by cloud. A brown discolouration is still visible curving away from Kharg's southwestern shore — directly over the area the radar identified as the centre of the slick — but the heavy cloud cover prevents an independent estimate of the southern extent.
  </script>

    <figure style="max-width:100%">

    </figure>
  </script>

  <script id="9may-s1-h" type="text/markdown">
    ## 9 May, 02:38 UTC — drift south

    By the next radar pass, the slick has broken into several discrete patches strung out 30–50 km south and southwest of Kharg, with smaller filaments trailing further. The total area of oil-affected water is comparable to that on 8 May — the spill has translated south and thinned, not dispersed. The fragments now sit in waters routinely used by tankers calling at the terminal.
  </script>
  <script id="9may-s1" type="text/html">
    <figure style="max-width:100%">

    </figure>
  </script>

  <script id="11may-s2-h" type="text/markdown">
    ## 11 May, 07:16 UTC — slick still tracking south

    Heavy cloud obscures Kharg's immediate vicinity, but breaks in cover further south reveal that the displaced slick is still tracking south. A bright, comma-shaped band of sheen is clearly visible around 28.75°N — roughly 55 km south of the island — with a fainter secondary swirl just below it. Closer in, sinuous reflective filaments are visible immediately south of Kharg's southern shore, suggesting that oil is still being released, or accumulating, at the source.
  </script>
